server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 15M;
    server_tokens off;

    # Security headers live inside SPA locations (/ and /sw.js) so /api and /uploads
    # do not duplicate App-backend Helmet headers.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.surepass.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: blob: https://*.finonest.com https://*.finonest.org https://*.googleapis.com https://*.gstatic.com https://*.tile.openstreetmap.org https://api.dicebear.com https://images.unsplash.com https://raw.githubusercontent.com https://cdnjs.cloudflare.com https://*.cardekho.com; connect-src 'self' https://*.finonest.com https://*.finonest.org wss://*.finonest.com wss://*.finonest.org https://maps.googleapis.com https://cdn.jsdelivr.net https://*.surepass.io https://router.project-osrm.org https://nominatim.openstreetmap.org https://api.postalpincode.in; frame-src 'self' blob: https://*.finonest.com https://*.finonest.org https://*.surepass.io; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self';" always;
    }

    location /uploads {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${BACKEND_HOST};
        proxy_set_header Host ${BACKEND_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CORS is enforced strictly by App-backend (createCorsOptions); do not inject wildcard CORS here
    location /api {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${BACKEND_HOST};
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host ${BACKEND_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
